{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Đăng nhập</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Tên tài khoản hoặc email<input name="identifier" required maxlength="254" autocomplete="username" value="{{ request.form.get('identifier', '') }}" placeholder="Tên tài khoản hoặc email"></label>
    <label>Mật khẩu<input name="password" type="password" required minlength="8" autocomplete="current-password"></label>
    <button>Đăng nhập</button>
  </form>
  <p>Chưa có tài khoản? <a href="{{ url_for('web.register') }}">Đăng ký</a></p>
</section>
{% endblock %}
