{% extends "base.html" %}
{% block title %}Tài khoản của tôi{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Tài khoản của tôi</h1>
  <p>Tên tài khoản: <strong>{{ current_user.username }}</strong></p>
  <p class="muted">Cập nhật email để đăng nhập bằng tên tài khoản hoặc email.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Email<input type="email" name="email" required maxlength="254" autocomplete="email" value="{{ request.form.get('email', current_user.email or '') }}"></label>
    <label>Mật khẩu hiện tại<input type="password" name="current_password" required autocomplete="current-password"></label>
    <button>Lưu email</button>
  </form>
</section>
{% endblock %}
