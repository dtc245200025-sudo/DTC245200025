global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 5s

scrape_configs:
  - job_name: chat-app
    static_configs:
      - targets: ["app:5000"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_oneoff]
        regex: True|true
        action: drop
      - source_labels: [container_label_com_docker_compose_project]
        regex: de32-chat
        action: keep
      - source_labels: [container_label_com_docker_compose_service]
        target_label: service
      - action: labeldrop
        regex: container_label_.*

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
