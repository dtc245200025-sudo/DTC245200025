worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # No query strings, Referer, cookies or request bodies in the access log.
    log_format main '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_user_agent"';
    access_log /dev/stdout main;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Limit login attempts, not navigation to the form.
    map $request_method $login_limit_key { default ""; POST $binary_remote_addr; }
    limit_req_zone $login_limit_key zone=login_limit:10m rate=10r/m;
    limit_req_status 429;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    # Docker DNS follows a new app container IP after a recreate.
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream linhchat_app {
        zone linhchat_app 64k;
        server app:5000 resolve;
    }

    server {
        listen 8080;
        server_name _;
        # 10 MiB file plus multipart fields. Flask enforces the file limit.
        client_max_body_size 11m;
        client_body_timeout 30s;
        client_header_timeout 15s;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        server_tokens off;

        location = /login {
            limit_req zone=login_limit burst=5 nodelay;
            proxy_pass http://linhchat_app;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /socket.io/ {
            proxy_pass http://linhchat_app;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600;
        }

        location / {
            proxy_pass http://linhchat_app;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /nginx_status {
            return 404;
        }
        location = /metrics { return 404; }
    }
    server {
        listen 8081;
        location = /nginx_status { stub_status; }
        location / { return 404; }
    }
}
